name: Scheduled Agent Run

on:
  schedule:
    - cron: '0 * * * *'  # Runs every hour
  workflow_dispatch:      # Allows manual trigger from GitHub UI

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Agent Cron Endpoint
        run: |
          curl -X GET "https://${{ secrets.APP_DOMAIN }}/api/agent/cron?secret=${{ secrets.CRON_SECRET }}"
